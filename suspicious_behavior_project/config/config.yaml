# ==============================================================================
# TÜBİTAK 2209-A: Yapay Zeka Destekli Hibrit Mimarili Şüpheli Davranış Tespiti
# ve Adil Yüz Tanıma Sistemi — Sistem Yapılandırma Dosyası (config.yaml)
# ==============================================================================

project:
  title: "Yapay Zeka Destekli Hibrit Mimarili Şüpheli Davranış Tespiti ve Adil Yüz Tanıma Sistemi"
  program: "TÜBİTAK 2209-A"
  author: "Murad Ashkar"
  advisor: "Prof. Dr. Eyüp Burak Ceyhan"
  institution: "Bartın Üniversitesi"

# ------------------------------------------------------------------------------
# 1. UÇ KATMANI (EDGE LAYER) — Kamera ve Video Akışı Ayarları
# ------------------------------------------------------------------------------
camera:
  # Girdi kaynağı: 0 (Webcam), video dosya yolu ("data/demo_cctv.mp4") veya RTSP URL
  # Eğer kamera (0) bulunamazsa sistem otomatik olarak gerçekçi CCTV test videosu üretir ve kullanır.
  source: 0
  fallback_video: "data/demo_cctv.mp4"
  camera_id: "CAM-01-GIRIS"
  # Çoklu akış (Hedef 1: En az 4 eşzamanlı 1080p akış >= 15 FPS)
  multi_stream_sources:
    - "data/demo_cctv.mp4"
    - "data/demo_cctv.mp4"
    - "data/demo_cctv.mp4"
    - "data/demo_cctv.mp4"
  frame:
    width: 1280
    height: 720
    fps: 30
    skip_frames: 1

# ------------------------------------------------------------------------------
# 2. UÇ KATMANI — Kişi Tespiti (YOLOv5)
# ------------------------------------------------------------------------------
model:
  type: "yolov5"
  weights: "yolov5m.pt"
  architecture: "yolov5m"
  confidence_threshold: 0.45
  iou_threshold: 0.45
  device: "auto"          # "auto", "cuda:0", veya "cpu"
  half_precision: false
  input_size: 320         # Hız/doğruluk dengesi için çıkarım boyutu

# ------------------------------------------------------------------------------
# 3. UÇ KATMANI — Kişi Takibi (DeepSORT + Re-ID Görünüm Gömme)
# ------------------------------------------------------------------------------
tracking:
  algorithm: "deepsort"
  max_age: 30             # Tespit olmadan izi koruma süresi (kare sayısı)
  min_hits: 2             # İzi onaylamak için gereken minimum ardışık tespit
  iou_threshold: 0.25     # IoU eşleştirme eşiği
  max_distance: 140.0     # Maksimum merkez/Kalman öklid mesafesi (piksel)
  appearance_model: "osnet_x0_25_msmt17"
  feature_dim: 512        # Re-ID görünüm vektör boyutu
  appearance_weight: 0.45 # Görünüm (kosinüs) ve hareket (Kalman/IoU) ağırlığı

# ------------------------------------------------------------------------------
# 4. UÇ KATMANI — Şüpheli Davranış / Amaçsız Bekleme (Loitering) Analizi
# ------------------------------------------------------------------------------
loitering_analysis:
  # (a) Zamansal Kriter: ROI içinde geçirilen minimum süre (saniye)
  # TÜBİTAK üretim değeri: 180 sn; canlı test/demo modunda (--demo) 5 sn kullanılır
  time_threshold_seconds: 180
  demo_time_threshold_seconds: 5.0
  # (b) Yörüngesel Kriter: Hareket Verimliliği = Net Yer Değiştirme / Toplam Yol Mesafesi
  trajectory_efficiency_threshold: 0.30
  min_path_points: 10
  # İlgi Alanları (Polygonal ROIs - 1280x720 çözünürlüğe göre)
  regions_of_interest:
    - name: "Main_Entrance_ROI"
      points: [[60, 80], [740, 80], [740, 680], [60, 680]]
    - name: "Sensitive_Area_ROI"
      points: [[750, 80], [1220, 80], [1220, 680], [750, 680]]
  alert:
    cooldown: 30          # Aynı kişi için tekrarlanan bulut aktarımı bekleme süresi (sn)
    threshold: 0.80

# ------------------------------------------------------------------------------
# 5. KVKK VERİ MİNİMİZASYONU VE BULUT KATMANI (CLOUD LAYER)
# ------------------------------------------------------------------------------
cloud:
  enabled: true
  host: "0.0.0.0"
  port: 8000
  api_url: "http://127.0.0.1:8000"
  kvkk_privacy_mode: true          # Ham video asla dışarı çıkmaz; yalnızca şüpheli yüz kırpımı + meta veri aktarılır
  blur_background_in_crops: false  # Kırpılan görüntü çevresini bulanıklaştırma

# ------------------------------------------------------------------------------
# 6. BULUT KATMANI — Adil Yüz Tanıma (ArcFace + FairFace Önyargı Azaltma)
# ------------------------------------------------------------------------------
face_recognition:
  architecture: "ArcFace-R50-FairFace"
  embedding_dim: 512
  similarity_metric: "cosine"
  match_threshold: 0.52            # FAR=0.001 (%0.1) güvenlik eşiği
  fairness_calibration: true       # FairFace demografik grup dengeleme (Hedef 4)
  demographic_groups:
    - "Middle_Eastern"
    - "White"
    - "Black"
    - "East_Asian"
    - "Southeast_Asian"
    - "Indian"
    - "Latino_Hispanic"

# ------------------------------------------------------------------------------
# 7. BULUT KATMANI — Milvus Vektör Veritabanı (İzleme Listesi / Watchlist)
# ------------------------------------------------------------------------------
milvus:
  host: "127.0.0.1"
  port: 19530
  collection_name: "tubitak_watchlist_faces"
  embedding_dim: 512
  metric_type: "COSINE"
  index_type: "IVF_FLAT"
  nlist: 128
  local_fallback_path: "data/watchlist_store.json"
